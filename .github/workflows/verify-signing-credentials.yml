name: Verify Signing Credentials

# Answers one question, in about a minute, without building anything:
# do the six Apple secrets stored in THIS repository actually work?
#
# A local signed build cannot answer it. `notarytool` on a developer machine
# reads a keychain profile, and `codesign` reads the login keychain — neither
# touches a GitHub secret, so a value that was mistyped when it was pasted here
# stays invisible until a release run dies ten minutes in, at notarization.
#
# Nothing is submitted and nothing is published: the certificate goes into a
# throwaway keychain that is deleted in the same job, and `notarytool history`
# is a read. Run it before the first release, and after rotating any credential.
#
# Plan: docs/plans/2026-08-18-gate-a-electron-signing.md (Task 1)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - name: Prove the certificate imports and carries a Developer ID identity
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not set on this repository"
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/verify.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" verify.keychain
          security default-keychain -s verify.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" verify.keychain
          security import "$certificate" -k verify.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" verify.keychain
          rm -f "$certificate"
          # The same grep the release workflow uses, so this proves the shape it
          # depends on and not merely that something was imported.
          identity="$(security find-identity -v -p codesigning verify.keychain | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "The stored certificate carries no Developer ID Application identity"
            exit 1
          fi
          # Safe to print: an identity name is public, and it is the whole point
          # of the run — it says WHICH team would sign a release.
          echo "identity: $identity"
          security delete-keychain verify.keychain

      - name: Prove the notarization credentials authenticate against Apple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not set on this repository"
              exit 1
            fi
          done
          # `history` is a read-only call that still requires full
          # authentication, so it fails exactly as a real submission would on a
          # mistyped app-specific password — but in seconds, and without
          # uploading a 150 MB archive.
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json > history.json
          echo "authenticated; submissions on record: $(python3 -c 'import json,sys;print(len(json.load(open("history.json")).get("history",[])))')"
