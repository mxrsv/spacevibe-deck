name: Tauri

# The Tauri host is feature-frozen and built by hand, so its Rust checks run
# only when its sources change rather than on every push (`ci.yml` used to
# carry them in `check`). `npm run build` comes first because the Tauri crate
# embeds the frontend bundle at compile time.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri.yml"
  pull_request:
    paths:
      - "src-tauri/**"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
