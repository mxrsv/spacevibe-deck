name: Electron Release

# The shipping release path. One pushed tag produces one release carrying
# macOS **and** Windows, both self-updating.
#
# `release.yml` builds Tauri and is retired from tag triggers as of 2026-08-20
# (`workflow_dispatch` only, kept for a manual hotfix). Nothing here touches it.
#
# ## Why one file and four jobs
#
# Two workflow files triggered by the same tag run with no knowledge of each
# other: both would race to create the release, and neither would have a point
# at which the full artifact set is known to be complete. The verification that
# keeps a half-built release invisible has to live DOWNSTREAM of both builds,
# which means one workflow.
#
#   prepare (ubuntu)              validate tag + version, strip build/, create the draft
#      |
#      +-- mac     (macos-latest)   sign, notarize, verify, publish into the draft
#      +-- windows (windows-latest) build, publish into the draft
#      |
#   promote (ubuntu)              verify the full asset set, then make it public
#
# ## Two failures this shape exists to prevent
#
# 1. **The trigger tag is not the release tag.** GitHub publishes a pushed tag
#    to `releases.atom` the instant it lands, while this run needs ~10 minutes.
#    Pushing the RELEASE tag therefore advertised a version whose manifest did
#    not exist yet: every running app that checked during the build fetched
#    `<channel>-mac.yml`, then `latest-mac.yml`, got 404 from both, and told its
#    user "Couldn't check for updates. Check your connection and try again."
#    Measured twice on 2026-08-19 against v0.12.5-electron.2.
#
#    `build/v…` is not valid semver, so `GitHubProvider` skips that feed entry
#    (GitHubProvider.js:71) and a running app sees nothing until the release is
#    real. The release tag is created by GitHub itself when the draft is
#    promoted, which happens only after every artifact is uploaded AND verified
#    — a draft holds a `tag_name` without creating the git ref, measured with a
#    probe release that produced an `untagged-…` URL and no remote tag.
#
# 2. **The draft is created before any publisher runs.** electron-builder runs
#    one publisher PER TARGET, concurrently. With no release to upload into,
#    the zip publisher and the dmg publisher both read "release doesn't exist"
#    and both CREATE one — measured on run 32232669706, which produced two
#    drafts on the same tag. With two platforms the same race is one platform
#    apart instead of one target apart, so `prepare` creates the draft once and
#    every publisher finds it.
#
# ## The tag shape is not free
#
# `GitHubProvider.getLatestVersion` skips every release whose tag fails
# `semver.valid`, and derives the update channel from `semver.prerelease(tag)[0]`.
# Two shapes are accepted here:
#
#   build/vX.Y.Z             a STABLE release, promoted with `--latest`
#   build/vX.Y.Z-electron.N  a prerelease on the `electron` channel
#
# The published macOS manifest is `latest-mac.yml`, not `electron-mac.yml`:
# app-builder-lib only copies the channel into `publish.channel` for the
# `generic` provider. The client asks for its channel file first and falls back
# to the default one, so the two halves meet — see `promote`'s assertions.
#
# Spec: docs/specs/2026-08-20-electron-stable-release-design.md
# Plan: docs/plans/2026-08-18-electron-release-pipeline.md (Tasks 6-8 baseline)
on:
  push:
    tags:
      - "build/v[0-9]+.[0-9]+.[0-9]+"
      - "build/v[0-9]+.[0-9]+.[0-9]+-electron.[0-9]+"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      prerelease: ${{ steps.target.outputs.prerelease }}
    steps:
      - name: Checkout the exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the tag, the version and the channel it names
        id: target
        env:
          BUILD_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `build/v1.2.3-electron.4` -> `v1.2.3-electron.4`
          TAG="${BUILD_TAG#build/}"
          # The version is the channel. Both halves of the update path derive
          # it from this one string — app-builder-lib from `appInfo.channel`
          # when `publish.channel` is unset, electron-updater from the tag —
          # so a version whose prerelease component changes word puts the build
          # on a different channel and orphans every installed one.
          #
          # Matched with a regex rather than `semver`: that package is only a
          # transitive of the toolchain here, not a declared dependency, and
          # this check must not start failing because someone else's dependency
          # tree moved.
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match package version $version"
            exit 1
          fi
          # Stable and `-electron.N` are BOTH real shapes now. The check is
          # relaxed, not deleted: a version naming any other prerelease word
          # would publish onto a channel no installed build ever asks for.
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-electron\.[0-9]+$ ]]; then
            prerelease=true
          else
            echo "Version $version must be X.Y.Z or X.Y.Z-electron.N — it names the update channel"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (prerelease=$prerelease)"

      - name: Validate source
        run: |
          # Run ONCE here, for both platforms. The build jobs are per-OS and
          # cost tens of minutes; a source failure must stop the run before
          # either of them starts, and running the suite twice proves nothing
          # twice.
          npm run generate:menu:check
          npm test
          npm run build

      - name: Create the draft release before anything can publish into it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -euo pipefail
          # Draft, so nothing is visible to an installed app until `promote`
          # has verified the whole asset set. `--target` is required because
          # the release tag does not exist yet, and must not until the
          # artifacts are proven; GitHub creates it from this commit at
          # promotion time.
          #
          # The notes are a placeholder. `promote` replaces them with the real
          # ones — composed there because the header has to state what the
          # finished release actually carries.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "$TAG" --notes "Build in progress."

  mac:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import the Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Lifted from `release.yml`'s step of the same name, including
          # `set-key-partition-list` — without it `codesign` blocks on a GUI
          # prompt that a headless runner can never answer.
          certificate="$RUNNER_TEMP/deck-developer-id.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$certificate" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          identity="$(security find-identity -v -p codesigning build.keychain | sed -n 's/.*"\(Developer ID Application:.*\)".*/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "No Developer ID Application identity was imported"
            exit 1
          fi
          rm -f "$certificate"

      - name: Build, sign, notarize and publish into the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          # One secret, two names. app-builder-lib reads
          # APPLE_APP_SPECIFIC_PASSWORD (MacTargetHelper.getNotarizeOptions);
          # `release.yml` reads the same value as APPLE_PASSWORD. Notarization
          # fails late and confusingly when this mapping is dropped.
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The preflight costs seconds and refuses a run that cannot finish;
          # a missing identity does NOT fail electron-builder, it silently
          # produces an unsigned app.
          node scripts/verify-electron-release-signing.mjs
          npm run build
          npm run electron:build
          npx electron-builder --config electron-builder.release.yml \
            --mac --arm64 --publish always

      - name: Verify the artifacts are signed, notarized and stapled
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(dist-electron-release/mac-arm64/*.app)
          images=(dist-electron-release/*.dmg)
          archives=(dist-electron-release/*.zip)
          manifests=(dist-electron-release/latest-mac.yml)
          if [[ ${#apps[@]} -ne 1 || ${#images[@]} -ne 1 ]]; then
            echo "Expected exactly one app bundle and one dmg"
            exit 1
          fi
          if [[ ${#archives[@]} -ne 1 || ${#manifests[@]} -ne 1 ]]; then
            # electron-updater reads the zip and this manifest, and nothing
            # else. Their absence is a release that installs and can never
            # update — the failure the whole pipeline exists to prevent.
            echo "Expected exactly one zip and a latest-mac.yml manifest"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          # node-pty's helper lives outside the asar. Notarization rejects any
          # unsigned Mach-O, so this is already implied — it is named because
          # it is the first thing a dependency bump breaks.
          codesign --verify --verbose=2 \
            "${apps[0]}/Contents/Resources/app.asar.unpacked/node_modules/node-pty/build/Release/spawn-helper"
          spctl --assess --type execute --verbose=2 "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
          # The strongest check, and the only offline one: the stapled ticket
          # has to satisfy `=notarized` on its own, with no call to Apple.
          codesign --test-requirement="=notarized" --verify --verbose=2 "${apps[0]}"
          # The DMG is deliberately NOT asserted here. electron-builder notarizes
          # and staples the .app and then packs the already-stapled bundle into an
          # unsigned disk image — `dmg.sign` defaults to false because signing it
          # "will lead to unwanted errors in combination with notarization
          # requirements" (macOptions.d.ts:293). So `stapler validate` on the dmg
          # fails by design, and Gatekeeper never assesses the image anyway: it
          # assesses the app at launch, which the line above already proves.

  windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: write
    # The runner's default shell is PowerShell; every script step here is bash
    # so it reads the same as the other three jobs. Git Bash ships on the
    # Windows image, so this costs nothing.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish the installer into the draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # NO SIGNING STEP, by decision (2026-08-19). electron-builder warns
          # and continues when no certificate is configured, so this produces
          # an unsigned installer: SmartScreen will warn on first install until
          # reputation accrues, and nothing in this pipeline can change that.
          # `promote` states it in the release notes because a user cannot
          # discover it from the app.
          npm run build
          npm run electron:build
          npx electron-builder --config electron-builder.release.yml \
            --win --x64 --publish always

      - name: Confirm the installer and its manifest were produced
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(dist-electron-release/*-setup.exe)
          manifests=(dist-electron-release/latest.yml)
          if [[ ${#installers[@]} -ne 1 || ${#manifests[@]} -ne 1 ]]; then
            echo "Expected exactly one *-setup.exe and a latest.yml manifest"
            printf '%s\n' dist-electron-release/*
            exit 1
          fi
          # This is the ONLY assertion this job can make. A runner cannot run
          # an interactive install and cannot exercise an update cycle, so
          # nothing here says the installer works — Gate C stays open, and the
          # docs say so rather than implying a green run proved it.

  promote:
    needs: [prepare, mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # This job deliberately does not check the repository out — it reads the
      # RELEASE, not the source. `gh` infers the repository from the git remote,
      # so without a checkout it needs to be told; `GH_REPO` is how, and it also
      # keeps every `gh` call here pointed at one repository rather than at
      # whatever a future checkout step happens to leave behind.
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Confirm the draft carries the exact asset set both platforms need
        run: |
          set -euo pipefail
          # This reads what the RELEASE actually serves, not what a runner
          # produced: a publisher that silently uploaded somewhere else still
          # exits zero, which is exactly how run 32232669706 produced a release
          # with a dmg and no zip.
          gh release view "$TAG" --json assets --jq '.assets[].name' | sort > published.txt
          cat published.txt
          require() {
            # `--` because two of the patterns below start with a hyphen.
            if ! grep -qE -- "$1" published.txt; then
              echo "Release $TAG is missing $2 — leaving it a draft."
              exit 1
            fi
          }
          require '\.dmg$'         'the macOS dmg (first install)'
          # The zip is the macOS update payload; Squirrel.Mac never reads the dmg.
          require '-mac\.zip$'     'the macOS zip (updater payload)'
          # `latest-mac.yml`, not `electron-mac.yml`: app-builder-lib copies the
          # version's prerelease component into `publish.channel` only for the
          # `generic` provider (PublishManager.js:413-431), so a GitHub release
          # always writes the default name. The client asks for
          # `electron-mac.yml` first and falls back to this one
          # (GitHubProvider.js:136-142), so the update path works — but the
          # assertion has to match what is actually published.
          require '^latest-mac\.yml$' 'the macOS update feed'
          # On Windows the installer is BOTH the first-install download and the
          # updater payload — there is no separate archive.
          require '-setup\.exe$'   'the Windows installer'
          require '^latest\.yml$'   'the Windows update feed'
          # Differential download. Present for the dmg and the mac zip today;
          # nsis adds one for the installer.
          require '\.blockmap$'     'a blockmap (differential download)'

      - name: Write the release notes
        run: |
          set -euo pipefail
          # Three things a user cannot discover from the app, so they are
          # stated on the release itself rather than left to be found.
          cat > release-notes.md <<'HEADER'
          ### Before you install

          - **The Windows installer is not code-signed.** SmartScreen will warn on
            first install: choose **More info** → **Run anyway**. The warning
            reflects the missing signature, not the build.
          - **Windows is not runtime-verified.** No Windows machine has run this
            host. Installation and auto-update on Windows are unproven.
          - **Intel Macs are not served.** The macOS build is Apple silicon
            (arm64) only.

          HEADER
          # GitHub's own commit list, generated against the commit the draft
          # targets — the tag does not exist yet, which is why
          # `target_commitish` is required here.
          if gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body \
              > generated-notes.md; then
            cat generated-notes.md >> release-notes.md
          else
            echo "Could not generate the commit list; shipping the header alone."
          fi
          cat release-notes.md
          # Set the notes BEFORE the release becomes visible, so no installed
          # app ever sees the "Build in progress." placeholder.
          gh release edit "$TAG" --notes-file release-notes.md

      - name: Promote the draft
        env:
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Promoting is also what CREATES the release tag, so this version
          # only becomes discoverable now, with every asset both platforms
          # need already proven to be on the release.
          #
          # A stable tag takes `--latest`: `releases/latest` served the Tauri
          # release until the cutover, and the stable Electron release is what
          # replaces it. An `-electron.N` tag stays a pre-release, found by
          # walking the feed for its own channel.
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --draft=false --prerelease=true
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest=true
          fi
