name: CI

# A change that touches only the landing (`marketing/**`) runs `landing.yml`
# instead, and one that touches only prose runs nothing. A change touching
# both runs each.
on:
  push:
    branches: [main]
    paths-ignore:
      - "marketing/**"
      - ".github/workflows/landing.yml"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "marketing/**"
      - ".github/workflows/landing.yml"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Several sessions push to `main` in quick succession; only the newest commit's
# result is worth waiting for.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `max-lines` is a warning in `.oxlintrc.json` itself, not by a flag here:
      # the 101 pre-existing over-length files stay a visible backlog (the rule
      # is forward-only) and a plain `oxlint` reads the same locally as it does
      # in CI. Every other lint error still fails the build.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      # `tsconfig.json` covers `src` only, and `tsconfig.electron.json` was
      # invoked by nothing in CI — so a type error anywhere in `electron/`
      # merged green, and Vitest transpiles the test files without checking
      # them. This step is the whole typecheck of the Electron main process.
      - name: Typecheck and bundle the Electron main process
        run: npm run electron:build

  # `backend/` is the analytics ingest Worker, and it is its own npm project
  # with its own lockfile — the root `npm test` deliberately excludes it
  # (its suite is `node:test`, which vitest cannot run). So without this job
  # the 18 tests covering the ingest contract, the retention window and the
  # cron sweep would gate nothing.
  #
  # No `wrangler deploy --dry-run` here: that step reads the live Cloudflare
  # account, and CI holds no credentials for it by design.
  backend-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  # `mobile/` is the phone companion: a shared protocol, the relay Worker and the Expo app, each its
  # own npm project with its own lockfile. The root's lint, typecheck and `npm test` skip it on
  # purpose (`.oxlintrc.json`, `.prettierignore`, the `test` script), so without this job nothing
  # would gate it. Nothing here deploys the relay or builds the iOS app: both need accounts CI
  # does not hold.
  mobile-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/**/package-lock.json

      - name: Install dependencies
        run: npm ci && node scripts/setup.mjs --ci

      - name: Check
        run: npm run check

  # By hand only (owner, 2026-09-11). It has been red on every push for weeks
  # with the pre-existing failures in docs/internals/traps.md, so on push it
  # spent a Windows runner and told nobody anything. Run it before a Windows
  # release: its `npm test` is the one place a real ConPTY is spawned.
  windows-check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      # This runner is the Windows machine Gate C has been waiting for. `npm test`
      # above already spawns a real ConPTY through `electron/pty/windows-pty.test.ts`
      # — the only kind of test that could have caught the string-vs-Buffer
      # crash the first Windows preview shipped with. This step adds the
      # typecheck the Electron host never had in CI.
      - name: Typecheck and bundle the Electron main process
        run: npm run electron:build

  # Build the Electron host's Windows installer ON WINDOWS.
  #
  # It was cross-built from a Mac to get the first preview out, and that path
  # is not one to keep: `@electron/rebuild` cannot cross-compile node-pty
  # (`node-gyp does not support cross-compiling native modules from source`),
  # so the cross-build only worked with the rebuild disabled and the shipped
  # prebuilds taken on trust. Here the native step runs for real.
  #
  # No private-repository guard: the owner published the unsigned Electron
  # preview from this public repo on 2026-08-18. The artifact is still unsigned
  # and SmartScreen still warns.
  #
  # `workflow_dispatch` only — a 119 MB artifact on every push is waste.
  #
  # Deliberately NOT `needs: windows-check`. That job has been red since before
  # this work — 17 failures on this runner, all of them pre-existing and none
  # of them about the Electron host: POSIX file modes, symlink realpath,
  # a vendored bundle hash, and `pty/info.test.ts` fixtures that hand POSIX
  # rows to whatever platform module the host resolves. Gating packaging behind
  # it would mean packaging never runs.
  windows-electron-package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run electron:build

      - name: Package unsigned Windows installer
        run: npx electron-builder --config electron-builder.yml --win --x64 --publish never

      - name: Upload Electron Windows preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-electron-windows-preview
          path: |
            dist-electron-app/*-setup.exe
            dist-electron-app/latest.yml
          if-no-files-found: error
          retention-days: 7
