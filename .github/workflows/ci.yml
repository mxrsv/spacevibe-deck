name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Check menu_registry.rs is up to date
        run: npm run generate:menu:check

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

      # `tsconfig.json` covers `src` only, and `tsconfig.electron.json` was
      # invoked by nothing in CI — so a type error anywhere in `electron/`
      # merged green, and Vitest transpiles the test files without checking
      # them. This step is the whole typecheck of the Electron main process.
      - name: Typecheck and bundle the Electron main process
        run: npm run electron:build

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

  windows-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Check menu_registry.rs is up to date
        run: npm run generate:menu:check

      - name: Test
        run: npm test

      - name: Test Windows bundle validator
        run: node --test scripts/verify-windows-bundle.test.mjs

      - name: Build frontend
        run: npm run build

      # This runner is the Windows machine Gate C has been waiting for. `npm test`
      # above already spawns a real ConPTY through `electron/pty/windows-pty.test.ts`
      # — the only kind of test that could have caught the string-vs-Buffer
      # crash the first Windows preview shipped with. This step adds the
      # typecheck the Electron host never had in CI.
      - name: Typecheck and bundle the Electron main process
        run: npm run electron:build

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build Windows desktop
        run: npm run tauri build -- --no-bundle --ci

  windows-engineering-bundle:
    if: github.event_name == 'workflow_dispatch'
    needs: windows-check
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Require a private repository
        shell: pwsh
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:REPOSITORY_PRIVATE -ne "true") {
            throw "Unsigned Windows artifacts may only be built in a private repository."
          }

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install dependencies
        run: npm ci

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri -> target

      - name: Build unsigned Windows setup
        run: npm run tauri build -- --ci

      - name: Validate Windows bundle
        run: npm run verify:windows-bundle -- src-tauri/target/release/bundle

      - name: Upload private engineering preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spacevibe-deck-windows-engineering-preview
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  # Build the Electron host's Windows installer ON WINDOWS.
  #
  # It was cross-built from a Mac to get the first preview out, and that path
  # is not one to keep: `@electron/rebuild` cannot cross-compile node-pty
  # (`node-gyp does not support cross-compiling native modules from source`),
  # so the cross-build only worked with the rebuild disabled and the shipped
  # prebuilds taken on trust. Here the native step runs for real.
  #
  # No private-repository guard, unlike `windows-engineering-bundle` above:
  # `release.yml` already publishes an unsigned Windows preview installer from
  # this public repo, and the owner published the Electron preview the same way
  # on 2026-08-18. The artifact is still unsigned and SmartScreen still warns.
  #
  # `workflow_dispatch` only — a 119 MB artifact on every push is waste.
  #
  # Deliberately NOT `needs: windows-check`. That job has been red since before
  # this work — 17 failures on this runner, all of them pre-existing and none
  # of them about the Electron host: POSIX file modes, symlink realpath,
  # a vendored bundle hash, and `pty/info.test.ts` fixtures that hand POSIX
  # rows to whatever platform module the host resolves. Gating packaging behind
  # it would mean packaging never runs, which is what already happened to
  # `windows-engineering-bundle` above.
  windows-electron-package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Build Electron main process
        run: npm run electron:build

      - name: Package unsigned Windows installer
        run: npx electron-builder --config electron-builder.yml --win --x64 --publish never

      - name: Upload Electron Windows preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deck-electron-windows-preview
          path: |
            dist-electron-app/*-setup.exe
            dist-electron-app/latest.yml
          if-no-files-found: error
          retention-days: 7
