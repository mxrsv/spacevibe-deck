name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  # Re-run the Windows preview alone against a tag that already shipped. The
  # Windows channel is an unsigned preview and will break again; without this,
  # retrying it means moving the tag, which rebuilds and republishes a macOS
  # release that was already fine.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to rebuild the Windows preview from"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
      rc: ${{ steps.pick.outputs.rc }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the target tag and commit
        id: pick
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # On a tag push these equal github.ref_name/github.sha; on a manual
          # run they come from the input, so every downstream job builds the
          # exact commit that tag points at rather than whatever main is now.
          #
          # Only an exact source tag is a release. This run creates
          # `-windows-preview` tags and channel releases of its own, and a
          # looser pattern would let one of those start another release.
          SOURCE_TAG='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.[1-9][0-9]*)?$'
          if [[ ! "$TAG" =~ $SOURCE_TAG ]]; then
            echo "Refusing a tag that is not an exact source tag: $TAG"
            exit 1
          fi
          git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 || {
            echo "Tag does not exist: $TAG"; exit 1;
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-list -n1 "refs/tags/$TAG")" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "rc=true" >> "$GITHUB_OUTPUT"
          else
            echo "rc=false" >> "$GITHUB_OUTPUT"
          fi

  prepare-release-notes:
    needs: resolve-target
    runs-on: ubuntu-latest
    outputs:
      stable_body: ${{ steps.notes.outputs.stable_body }}
      windows_body: ${{ steps.notes.outputs.windows_body }}
    steps:
      - name: Checkout release-note tooling and tag history
        uses: actions/checkout@v4
        with:
          # A tag push checks out its own generator. A manual Windows retry
          # checks out the workflow branch so an older source tag can still use
          # the current release tooling without changing the artifact source.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate mandatory user-facing release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
          TARGET_TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            gh release view "$TARGET_TAG" --json body --jq .body \
              > reviewed-release-notes.md
            node scripts/generate-release-notes.mjs \
              --body-file reviewed-release-notes.md --channel stable \
              > stable-release-notes.md
            node scripts/generate-release-notes.mjs \
              --body-file stable-release-notes.md --channel windows-preview \
              > windows-release-notes.md
          else
            node scripts/generate-release-notes.mjs \
              --tag "$TARGET_TAG" --sha "$TARGET_SHA" --channel stable \
              > stable-release-notes.md
            node scripts/generate-release-notes.mjs \
              --tag "$TARGET_TAG" --sha "$TARGET_SHA" --channel windows-preview \
              > windows-release-notes.md
          fi

          append_output() {
            local name="$1"
            local path="$2"
            local random_suffix
            local delimiter
            local attempts=0
            while (( attempts < 5 )); do
              random_suffix="$(openssl rand -hex 16)"
              [[ "$random_suffix" =~ ^[0-9a-f]{32}$ ]] || return 1
              delimiter="deck_release_notes_${random_suffix}"
              if ! grep -Fxq "$delimiter" "$path"; then
                break
              fi
              attempts=$((attempts + 1))
            done
            if grep -Fxq "$delimiter" "$path"; then
              echo "Could not generate a safe GitHub output delimiter" >&2
              return 1
            fi
            printf '%s<<%s\n' "$name" "$delimiter" >> "$GITHUB_OUTPUT"
            cat "$path" >> "$GITHUB_OUTPUT"
            printf '\n%s\n' "$delimiter" >> "$GITHUB_OUTPUT"
          }
          append_output stable_body stable-release-notes.md
          append_output windows_body windows-release-notes.md

  validate-source:
    needs: resolve-target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Require updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$DECK_UPDATER_PUBLIC_KEY" || { echo "DECK_UPDATER_PUBLIC_KEY is required"; exit 1; }

      - name: Validate tag and source versions
        env:
          TARGET_TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          node -e '
            const fs = require("node:fs");
            const version = require("./package.json").version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const tag = process.env.TARGET_TAG;
            if (!/^v\d+\.\d+\.\d+(-rc\.\d+)?$/.test(tag) || tag !== `v${version}` || cargo !== version || tauri !== version) {
              throw new Error(`Version mismatch: tag=${tag} package=${version} cargo=${cargo} tauri=${tauri}`);
            }
          '

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run generate:menu:check
          npm test
          npm run build
          npm run test:updater-manifest
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml

  build-macos-stable-draft:
    # Skipped on a manual run — that path exists to retry Windows alone.
    if: github.event_name == 'push'
    needs: [resolve-target, validate-source, prepare-release-notes]
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust with universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Inject the updater public key into the platform configs
        env:
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          # The platform configs ship an empty `plugins.updater.pubkey` on
          # purpose — the key belongs to the repo variable, not the tree. It has
          # to be written in before bundling: DECK_UPDATER_PUBLIC_KEY reaches
          # Rust through option_env!, which the bundler never sees, so an empty
          # pubkey here fails the build with "Missing comment in public key"
          # AFTER the installer is already built.
          for config in src-tauri/tauri.macos.conf.json src-tauri/tauri.windows.conf.json; do
            jq --arg key "$DECK_UPDATER_PUBLIC_KEY" \
              '.plugins.updater.pubkey = $key' "$config" > "$config.tmp"
            mv "$config.tmp" "$config"
          done

      - name: Point release candidates at the isolated RC channels
        if: needs.resolve-target.outputs.rc == 'true'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # A release candidate must never move a production channel: rc.1
          # discovers rc.2 through these endpoints, while `releases/latest` and
          # the Windows preview channel keep serving the shipped build.
          jq --arg url "https://github.com/$REPOSITORY/releases/download/macos-rc-channel/latest.json" \
            '.plugins.updater.endpoints = [$url]' src-tauri/tauri.macos.conf.json > macos-rc.tmp
          mv macos-rc.tmp src-tauri/tauri.macos.conf.json
          jq --arg url "https://github.com/$REPOSITORY/releases/download/windows-rc-channel/latest.json" \
            '.plugins.updater.endpoints = [$url]' src-tauri/tauri.windows.conf.json > windows-rc.tmp
          mv windows-rc.tmp src-tauri/tauri.windows.conf.json

      - name: Build stable macOS updater draft
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        with:
          tagName: ${{ needs.resolve-target.outputs.tag }}
          releaseName: ${{ needs.resolve-target.outputs.rc == 'true' && 'SpaceVibe Deck v__VERSION__ — Release Candidate' || 'SpaceVibe Deck v__VERSION__' }}
          releaseBody: ${{ needs.prepare-release-notes.outputs.stable_body }}
          releaseCommitish: ${{ needs.resolve-target.outputs.sha }}
          releaseDraft: true
          prerelease: ${{ needs.resolve-target.outputs.rc == 'true' }}
          args: --config src-tauri/tauri.release.conf.json --target universal-apple-darwin

      - name: Collect exact macOS updater artifacts
        shell: bash
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          SOURCE_SHA: ${{ needs.resolve-target.outputs.sha }}
          SOURCE_TAG: ${{ needs.resolve-target.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage=updater-artifacts
          mkdir "$stage"
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          # One universal `.app.tar.gz` serves both Darwin targets; the DMG is
          # the manual-install download that ships beside it.
          payloads=("$bundle"/macos/*.app.tar.gz)
          signatures=("$bundle"/macos/*.app.tar.gz.sig)
          images=("$bundle"/dmg/*.dmg)
          if [ ${#payloads[@]} -ne 1 ] || [ ${#signatures[@]} -ne 1 ] || [ ${#images[@]} -ne 1 ]; then
            echo "Expected exactly one updater bundle, one signature and one DMG"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$stage/release.json"
          if [ "$(jq '.assets | length' "$stage/release.json")" -ne 4 ]; then
            echo "Expected exactly four macOS draft assets"
            exit 1
          fi
          while IFS=$'\t' read -r id name; do
            if [ -z "$name" ] || [[ "$name" == */* ]]; then
              echo "Unsafe macOS draft asset name: $name"
              exit 1
            fi
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$stage/$name"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' "$stage/release.json")

          # tauri-action sanitizes and versions uploaded filenames. Preserve
          # those public names in provenance, but first prove their bytes are
          # exactly the local bundle outputs from this runner.
          staged_payloads=("$stage"/*.app.tar.gz)
          staged_signatures=("$stage"/*.app.tar.gz.sig)
          staged_images=("$stage"/*.dmg)
          if [ ${#staged_payloads[@]} -ne 1 ] || [ ${#staged_signatures[@]} -ne 1 ] || [ ${#staged_images[@]} -ne 1 ]; then
            echo "Draft does not carry the exact macOS updater asset set"
            exit 1
          fi
          cmp -s latest.json "$stage/latest.json"
          cmp -s "${payloads[0]}" "${staged_payloads[0]}"
          cmp -s "${signatures[0]}" "${staged_signatures[0]}"
          cmp -s "${images[0]}" "${staged_images[0]}"
          node scripts/create-updater-provenance.mjs \
            --artifact-dir "$stage" --sha "$SOURCE_SHA" --tag "$SOURCE_TAG"

      - name: Upload exact-SHA macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts
          if-no-files-found: error
          retention-days: 7

  validate-macos-stable:
    needs: [resolve-target, build-macos-stable-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download staged macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts

      - name: Re-download the macOS draft and its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-macos-stable-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          # The staged copy only proves what the runner produced. What the
          # updater will actually download is whatever this draft serves now,
          # so cryptographic verification reads these bytes and nothing else.
          mkdir release-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-response.json
          jq -r '.assets[] | [.id, .name] | @tsv' release-response.json > assets.tsv
          test -s assets.tsv || { echo "Draft carries no assets"; exit 1; }
          while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "release-assets/$name"
          done < assets.tsv

      - name: Validate the macOS updater trust chain
        env:
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
          SOURCE_SHA: ${{ needs.resolve-target.outputs.sha }}
          SOURCE_TAG: ${{ needs.resolve-target.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-updater-manifest.mjs \
            --manifest updater-artifacts/latest.json \
            --release release-response.json \
            --provenance updater-artifacts/provenance.json \
            --staged-dir updater-artifacts \
            --release-dir release-assets \
            --version "$VERSION" \
            --sha "$SOURCE_SHA" \
            --tag "$SOURCE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --platform macos \
            --prerelease "${{ needs.resolve-target.outputs.rc }}" \
            --public-key "$DECK_UPDATER_PUBLIC_KEY"

      - name: Preserve validated macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-macos-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts
          if-no-files-found: error
          retention-days: 7

  build-windows-preview-draft:
    needs: [resolve-target, validate-source, prepare-release-notes]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Validate Windows source
        run: |
          npm run generate:menu:check
          npm test
          npm run build
          npm run test:updater-manifest
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Inject the updater public key into the platform configs
        env:
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          # The platform configs ship an empty `plugins.updater.pubkey` on
          # purpose — the key belongs to the repo variable, not the tree. It has
          # to be written in before bundling: DECK_UPDATER_PUBLIC_KEY reaches
          # Rust through option_env!, which the bundler never sees, so an empty
          # pubkey here fails the build with "Missing comment in public key"
          # AFTER the installer is already built.
          for config in src-tauri/tauri.macos.conf.json src-tauri/tauri.windows.conf.json; do
            jq --arg key "$DECK_UPDATER_PUBLIC_KEY" \
              '.plugins.updater.pubkey = $key' "$config" > "$config.tmp"
            mv "$config.tmp" "$config"
          done

      - name: Point release candidates at the isolated RC channels
        if: needs.resolve-target.outputs.rc == 'true'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          # A release candidate must never move a production channel: rc.1
          # discovers rc.2 through these endpoints, while `releases/latest` and
          # the Windows preview channel keep serving the shipped build.
          jq --arg url "https://github.com/$REPOSITORY/releases/download/macos-rc-channel/latest.json" \
            '.plugins.updater.endpoints = [$url]' src-tauri/tauri.macos.conf.json > macos-rc.tmp
          mv macos-rc.tmp src-tauri/tauri.macos.conf.json
          jq --arg url "https://github.com/$REPOSITORY/releases/download/windows-rc-channel/latest.json" \
            '.plugins.updater.endpoints = [$url]' src-tauri/tauri.windows.conf.json > windows-rc.tmp
          mv windows-rc.tmp src-tauri/tauri.windows.conf.json

      - name: Build unsigned Windows preview draft
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        with:
          tagName: ${{ needs.resolve-target.outputs.tag }}-windows-preview
          releaseName: "SpaceVibe Deck v__VERSION__ — Unsigned Windows Preview"
          releaseBody: ${{ needs.prepare-release-notes.outputs.windows_body }}
          releaseCommitish: ${{ needs.resolve-target.outputs.sha }}
          releaseDraft: true
          prerelease: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Collect exact Windows updater artifact
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          SOURCE_SHA: ${{ needs.resolve-target.outputs.sha }}
          PREVIEW_TAG: ${{ needs.resolve-target.outputs.tag }}-windows-preview
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $stage = "updater-artifacts"
          New-Item -ItemType Directory -Path $stage | Out-Null
          # Tauri v2 signs the NSIS installer itself: the updater payload is
          # `*-setup.exe` plus `*-setup.exe.sig`. There is no `.nsis.zip` — that
          # was the v1 layout, and expecting it failed this job after a clean
          # 6-minute build.
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe")
          $signatures = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe.sig")
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Filter "*.msi")
          if ($installers.Count -ne 1 -or $signatures.Count -ne 1 -or $msi.Count -ne 0) {
            throw "Expected exactly one NSIS installer, one signature, and zero MSI files."
          }
          $releasePath = Join-Path $stage "release.json"
          gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | Set-Content -Encoding utf8 $releasePath
          $release = Get-Content -Raw $releasePath | ConvertFrom-Json
          if (@($release.assets).Count -ne 3) {
            throw "Expected exactly three Windows draft assets."
          }
          foreach ($asset in $release.assets) {
            $name = [string]$asset.name
            if ([string]::IsNullOrWhiteSpace($name) -or [IO.Path]::GetFileName($name) -ne $name) {
              throw "Unsafe Windows draft asset name: $name"
            }
            $destination = Join-Path $stage $name
            gh api -H "Accept: application/octet-stream" "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" > $destination
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download Windows draft asset: $name"
            }
          }

          # tauri-action may sanitize uploaded filenames. Hash the public
          # assets against the local NSIS outputs before provenance records the
          # exact names that the updater will download.
          $stagedInstallers = @(Get-ChildItem $stage -Filter "*-setup.exe")
          $stagedSignatures = @(Get-ChildItem $stage -Filter "*-setup.exe.sig")
          if ($stagedInstallers.Count -ne 1 -or $stagedSignatures.Count -ne 1) {
            throw "Draft does not carry the exact Windows updater asset set."
          }
          function Assert-SameFile([string]$localPath, [string]$draftPath) {
            $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $localPath).Hash
            $draftHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $draftPath).Hash
            if ($localHash -ne $draftHash) {
              throw "Windows draft asset differs from the local build: $draftPath"
            }
          }
          Assert-SameFile "latest.json" (Join-Path $stage "latest.json")
          Assert-SameFile $installers[0].FullName $stagedInstallers[0].FullName
          Assert-SameFile $signatures[0].FullName $stagedSignatures[0].FullName
          node scripts/create-updater-provenance.mjs --artifact-dir $stage --sha $env:SOURCE_SHA --tag $env:PREVIEW_TAG

      - name: Upload exact-SHA Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts
          if-no-files-found: error
          retention-days: 7

  validate-windows-preview:
    needs: [resolve-target, build-windows-preview-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download staged Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts

      - name: Re-download the Windows draft and its assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-windows-preview-draft.outputs.release_id }}
        run: |
          set -euo pipefail
          # The staged copy only proves what the runner produced. What the
          # updater will actually download is whatever this draft serves now,
          # so cryptographic verification reads these bytes and nothing else.
          mkdir release-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-response.json
          jq -r '.assets[] | [.id, .name] | @tsv' release-response.json > assets.tsv
          test -s assets.tsv || { echo "Draft carries no assets"; exit 1; }
          while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "release-assets/$name"
          done < assets.tsv

      - name: Validate the Windows updater trust chain
        env:
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
          SOURCE_SHA: ${{ needs.resolve-target.outputs.sha }}
          PREVIEW_TAG: ${{ needs.resolve-target.outputs.tag }}-windows-preview
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-updater-manifest.mjs \
            --manifest updater-artifacts/latest.json \
            --release release-response.json \
            --provenance updater-artifacts/provenance.json \
            --staged-dir updater-artifacts \
            --release-dir release-assets \
            --version "$VERSION" \
            --sha "$SOURCE_SHA" \
            --tag "$PREVIEW_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --platform windows \
            --prerelease true \
            --public-key "$DECK_UPDATER_PUBLIC_KEY"

      - name: Preserve validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts
          if-no-files-found: error
          retention-days: 7

  publish-macos-stable:
    needs: [resolve-target, build-macos-stable-draft, validate-macos-stable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish validated macOS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-macos-stable-draft.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

  publish-windows-preview:
    needs:
      [resolve-target, build-windows-preview-draft, validate-windows-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish validated unsigned Windows preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-windows-preview-draft.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

  promote-macos-rc-channel:
    if: needs.resolve-target.outputs.rc == 'true'
    needs: [resolve-target, publish-macos-stable, validate-macos-stable]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated exact-SHA macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-macos-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts

      - name: Create or update the macOS release-candidate channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release candidates upgrade through this channel alone. The stable
          # channel is `releases/latest`, which a prerelease never moves.
          if ! gh release view macos-rc-channel >/dev/null 2>&1; then
            gh release create macos-rc-channel \
              --target "${{ needs.resolve-target.outputs.sha }}" \
              --title "SpaceVibe Deck — macOS Release Candidate Channel" \
              --notes "Release-candidate channel used to verify the updater end to end. Not a stable release." \
              --prerelease
          fi
          gh release upload macos-rc-channel updater-artifacts/latest.json --clobber

  promote-windows-rc-channel:
    if: needs.resolve-target.outputs.rc == 'true'
    needs: [resolve-target, publish-windows-preview, validate-windows-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated exact-SHA Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts

      - name: Create or update the Windows release-candidate channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view windows-rc-channel >/dev/null 2>&1; then
            gh release create windows-rc-channel \
              --target "${{ needs.resolve-target.outputs.sha }}" \
              --title "SpaceVibe Deck — Windows Release Candidate Channel" \
              --notes "Unsigned release-candidate channel used to verify the updater end to end. Not the Windows preview channel." \
              --prerelease
          fi
          gh release upload windows-rc-channel updater-artifacts/latest.json --clobber

  promote-windows-channel:
    # Final releases only. A release candidate that moved this channel would
    # hand every preview user an unverified build.
    if: needs.resolve-target.outputs.rc != 'true'
    needs: [resolve-target, publish-windows-preview, validate-windows-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated exact-SHA artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts

      - name: Create or update fixed preview channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks the repo out, so `gh` has no git remote to
          # infer the repository from and dies with "not a git repository".
          # GH_REPO is what tells it, without pulling in a checkout for two
          # API calls.
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view windows-preview-channel >/dev/null 2>&1; then
            gh release create windows-preview-channel \
              --target "${{ needs.resolve-target.outputs.sha }}" \
              --title "SpaceVibe Deck — Unsigned Windows Preview Channel" \
              --notes "Unsigned Windows preview channel. SmartScreen or Unknown publisher warnings are expected; this is not a stable Windows release." \
              --prerelease
          fi
          gh release upload windows-preview-channel updater-artifacts/latest.json --clobber
