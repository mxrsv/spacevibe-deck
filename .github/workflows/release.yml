name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # Re-run the Windows preview alone against a tag that already shipped. The
  # Windows channel is an unsigned preview and will break again; without this,
  # retrying it means moving the tag, which rebuilds and republishes a macOS
  # release that was already fine.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to rebuild the Windows preview from"
        required: true
        type: string

permissions:
  contents: read

jobs:
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the target tag and commit
        id: pick
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # On a tag push these equal github.ref_name/github.sha; on a manual
          # run they come from the input, so every downstream job builds the
          # exact commit that tag points at rather than whatever main is now.
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Refusing a non-release tag: $TAG"; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1 || {
            echo "Tag does not exist: $TAG"; exit 1;
          }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-list -n1 "refs/tags/$TAG")" >> "$GITHUB_OUTPUT"

  validate-source:
    needs: resolve-target
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Require updater signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY is required"; exit 1; }
          test -n "$DECK_UPDATER_PUBLIC_KEY" || { echo "DECK_UPDATER_PUBLIC_KEY is required"; exit 1; }

      - name: Validate tag and source versions
        run: |
          node -e '
            const fs = require("node:fs");
            const version = require("./package.json").version;
            const cargo = fs.readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
            const tauri = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
            const tag = process.env.GITHUB_REF_NAME;
            if (!/^v\d+\.\d+\.\d+$/.test(tag) || tag !== `v${version}` || cargo !== version || tauri !== version) {
              throw new Error(`Version mismatch: tag=${tag} package=${version} cargo=${cargo} tauri=${tauri}`);
            }
          '

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run generate:menu:check
          npm test
          npm run build
          npm run test:updater-manifest
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml

  build-macos-stable-draft:
    # Skipped on a manual run — that path exists to retry Windows alone.
    if: github.event_name == 'push'
    needs: [resolve-target, validate-source]
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust with universal targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Inject the updater public key into the platform configs
        env:
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          # The platform configs ship an empty `plugins.updater.pubkey` on
          # purpose — the key belongs to the repo variable, not the tree. It has
          # to be written in before bundling: DECK_UPDATER_PUBLIC_KEY reaches
          # Rust through option_env!, which the bundler never sees, so an empty
          # pubkey here fails the build with "Missing comment in public key"
          # AFTER the installer is already built.
          for config in src-tauri/tauri.macos.conf.json src-tauri/tauri.windows.conf.json; do
            jq --arg key "$DECK_UPDATER_PUBLIC_KEY" \
              '.plugins.updater.pubkey = $key' "$config" > "$config.tmp"
            mv "$config.tmp" "$config"
          done

      - name: Build stable macOS updater draft
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        with:
          tagName: ${{ needs.resolve-target.outputs.tag }}
          releaseName: "SpaceVibe Deck v__VERSION__"
          releaseBody: |
            Stable macOS release. Existing v0.9.0 users must install this first updater-enabled build manually once.
          releaseCommitish: ${{ needs.resolve-target.outputs.sha }}
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json --target universal-apple-darwin

      - name: Validate macOS updater manifest
        env:
          EXPECTED_VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            if (manifest.version !== process.env.EXPECTED_VERSION) throw new Error("macOS updater version mismatch");
            for (const target of ["darwin-aarch64", "darwin-x86_64"]) {
              const item = manifest.platforms?.[target];
              if (!item?.signature?.trim() || !item.url?.startsWith("https://api.github.com/repos/mxrsv/spacevibe-deck/releases/assets/")) {
                throw new Error(`Invalid macOS updater target: ${target}`);
              }
            }
          '

  build-windows-preview-draft:
    needs: [resolve-target, validate-source]
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Validate Windows source
        run: |
          npm run generate:menu:check
          npm test
          npm run build
          npm run test:updater-manifest
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Inject the updater public key into the platform configs
        env:
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        shell: bash
        run: |
          # The platform configs ship an empty `plugins.updater.pubkey` on
          # purpose — the key belongs to the repo variable, not the tree. It has
          # to be written in before bundling: DECK_UPDATER_PUBLIC_KEY reaches
          # Rust through option_env!, which the bundler never sees, so an empty
          # pubkey here fails the build with "Missing comment in public key"
          # AFTER the installer is already built.
          for config in src-tauri/tauri.macos.conf.json src-tauri/tauri.windows.conf.json; do
            jq --arg key "$DECK_UPDATER_PUBLIC_KEY" \
              '.plugins.updater.pubkey = $key' "$config" > "$config.tmp"
            mv "$config.tmp" "$config"
          done

      - name: Build unsigned Windows preview draft
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          DECK_UPDATER_PUBLIC_KEY: ${{ vars.DECK_UPDATER_PUBLIC_KEY }}
        with:
          tagName: ${{ needs.resolve-target.outputs.tag }}-windows-preview
          releaseName: "SpaceVibe Deck v__VERSION__ — Unsigned Windows Preview"
          releaseBody: |
            **Unsigned Windows Preview** — this is not the stable Windows channel.

            Windows may show SmartScreen or `Unknown publisher` because this preview has no paid Authenticode certificate. The updater payload still requires Deck's Tauri signature before installation.
          releaseCommitish: ${{ needs.resolve-target.outputs.sha }}
          releaseDraft: true
          prerelease: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Collect exact Windows updater artifact
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          PREVIEW_TAG: ${{ needs.resolve-target.outputs.tag }}-windows-preview
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $stage = "updater-artifacts"
          New-Item -ItemType Directory -Path $stage | Out-Null
          # Tauri v2 signs the NSIS installer itself: the updater payload is
          # `*-setup.exe` plus `*-setup.exe.sig`. There is no `.nsis.zip` — that
          # was the v1 layout, and expecting it failed this job after a clean
          # 6-minute build.
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe")
          $signatures = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*-setup.exe.sig")
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -Filter "*.msi")
          if ($installers.Count -ne 1 -or $signatures.Count -ne 1 -or $msi.Count -ne 0) {
            throw "Expected exactly one NSIS installer, one signature, and zero MSI files."
          }
          Copy-Item "latest.json" $stage
          Copy-Item $signatures[0].FullName $stage
          Copy-Item $installers[0].FullName $stage
          gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | Set-Content -Encoding utf8 "$stage/release.json"
          node scripts/create-updater-provenance.mjs --artifact-dir $stage --sha $env:GITHUB_SHA --tag $env:PREVIEW_TAG

      - name: Upload exact-SHA Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts
          if-no-files-found: error
          retention-days: 7

  validate-windows-preview:
    needs: [resolve-target, build-windows-preview-draft]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download exact-SHA Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts

      - name: Validate Windows updater manifest and provenance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/verify-updater-manifest.mjs \
            --manifest updater-artifacts/latest.json \
            --release updater-artifacts/release.json \
            --provenance updater-artifacts/provenance.json \
            --artifact-dir updater-artifacts \
            --version "$VERSION" \
            --sha "$GITHUB_SHA" \
            --tag "${GITHUB_REF_NAME}-windows-preview" \
            --repository "$GITHUB_REPOSITORY" \
            --target windows-x86_64

      - name: Preserve validated artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts
          if-no-files-found: error
          retention-days: 7

  publish-macos-stable:
    needs: [resolve-target, build-macos-stable-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish validated macOS release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-macos-stable-draft.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

  publish-windows-preview:
    needs: [resolve-target, build-windows-preview-draft, validate-windows-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish validated unsigned Windows preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.build-windows-preview-draft.outputs.release_id }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

  promote-windows-channel:
    needs: [resolve-target, publish-windows-preview, validate-windows-preview]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated exact-SHA artifact
        uses: actions/download-artifact@v4
        with:
          name: validated-windows-updater-${{ needs.resolve-target.outputs.sha }}
          path: updater-artifacts

      - name: Create or update fixed preview channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job never checks the repo out, so `gh` has no git remote to
          # infer the repository from and dies with "not a git repository".
          # GH_REPO is what tells it, without pulling in a checkout for two
          # API calls.
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view windows-preview-channel >/dev/null 2>&1; then
            gh release create windows-preview-channel \
              --target "${{ needs.resolve-target.outputs.sha }}" \
              --title "SpaceVibe Deck — Unsigned Windows Preview Channel" \
              --notes "Unsigned Windows preview channel. SmartScreen or Unknown publisher warnings are expected; this is not a stable Windows release." \
              --prerelease
          fi
          gh release upload windows-preview-channel updater-artifacts/latest.json --clobber
