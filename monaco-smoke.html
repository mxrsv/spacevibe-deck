<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deck Monaco Smoke</title>
    <!-- The packaged Monaco smoke harness: a permanent
         verification page, never part of the application graph. Only
         vite.monaco-smoke.config.mjs builds it; scripts/monaco-smoke-entry.test.ts proves
         the shipping renderer cannot reach it. -->
    <style>
      .monaco-smoke {
        display: flex;
        height: 100vh;
        gap: 8px;
        padding: 8px;
        box-sizing: border-box;
      }
      .monaco-smoke__half {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .monaco-smoke__controls {
        display: flex;
        gap: 6px;
        flex: none;
      }
      .monaco-smoke__term {
        flex: 1;
        min-height: 0;
        display: flex;
      }
    </style>
    <script type="module" src="/src/files/monaco-smoke-main.tsx" defer></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
