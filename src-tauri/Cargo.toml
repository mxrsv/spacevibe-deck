[package]
name = "spacevibe-deck"
version = "0.12.3"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spacevibe_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tokio = { version = "1", features = ["time"] }
base64 = "0.22"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"

# The updater that runs during an upgrade is the one inside the OLD build, so
# these fixes have to ship before they can protect anything. The published crate
# still deletes the installed macOS app before the replacement lands and drops
# the only backup when the final move fails (tauri-apps/plugins-workspace#3505),
# and gives the installed bundle the extraction temp directory's 0700 mode
# (#3506). Pinned to an exact commit, never a branch: a moving ref would change
# what ships without changing this file. Unpin once upstream releases a version
# containing #3505, #3506 and #3516.
[patch.crates-io]
tauri-plugin-updater = { git = "https://github.com/mxrsv/plugins-workspace", rev = "71df1a095d007fb94f0eb07940b0a78e57ac984e" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
wmi = "0.18"
# Keep wmi's loose windows-core range aligned with the windows 0.61 bindings
# already selected by Tauri. Mixed 0.61/0.62 COM traits do not interoperate.
windows-core = "=0.61.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
# Already in the lock transitively via tauri; declared directly so the
# ICoreWebView2Settings3 call has a supported path. Must stay on the same
# windows-core 0.61 bindings as the pin above — mixed 0.61/0.62 COM traits do
# not interoperate.
webview2-com = "0.38"
